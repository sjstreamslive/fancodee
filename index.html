
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>fancode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(239, 68, 68, 0.18), transparent 28rem),
                radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.12), transparent 30rem),
                #090d16;
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.76);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }

        .match-card {
            box-shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
        }

        .match-card:focus-visible,
        .icon-button:focus-visible {
            outline: 2px solid #ef4444;
            outline-offset: 3px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

        body.modal-open { overflow: hidden; }

        /* Ensure the native video completely fills its container */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            outline: none;
            border: none;
        }
    </style>
</head>
<body>
    <div class="min-h-screen pb-10">
        <nav class="glass-nav sticky top-0 z-40 w-full">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 py-4 flex justify-between items-center gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="grid place-items-center w-10 h-10 rounded-lg bg-red-600 shadow-lg shadow-red-950/40">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-xl sm:text-2xl font-black tracking-wide text-white uppercase truncate">
                            Fancode<span class="text-red-500"> Live</span>
                        </h1>
                        <p id="update-time" class="text-xs text-slate-400 truncate">Live sports streams</p>
                    </div>
                </div>

                <div class="hidden sm:flex items-center gap-2 text-xs font-semibold text-slate-300 bg-slate-900/70 px-3 py-2 rounded-lg border border-slate-700/70">
                    <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                    Fast match access
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-7xl px-4 sm:px-6 mt-6 sm:mt-8">
            <section class="mb-6 sm:mb-8">
                <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
                    <div>
                        <p class="text-sm font-semibold text-red-300 uppercase tracking-[0.2em]">Now Streaming</p>
                        <h2 class="mt-2 text-3xl sm:text-4xl font-black text-white tracking-tight">Live Matches</h2>
                    </div>
                    <div id="match-count" class="text-sm text-slate-400"></div>
                </div>
            </section>

            <div id="loader" class="flex flex-col items-center justify-center py-32">
                <div class="w-12 h-12 border-4 border-slate-700 border-t-red-500 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 font-medium tracking-wide">Fetching live matches...</p>
            </div>

            <div id="matches-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 hidden"></div>
        </main>

        <div id="player-modal" class="fixed inset-0 bg-black/95 hidden z-50 flex-col items-center justify-center p-2 sm:p-5 backdrop-blur-md">
            <div class="w-full max-w-6xl relative flex flex-col gap-3">
                <div class="flex items-center justify-between gap-3 rounded-lg border border-slate-800 bg-slate-950/80 px-3 sm:px-4 py-3">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-2 text-white font-bold text-xs bg-red-600 px-2 py-1 rounded">
                                <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>LIVE
                            </span>
                            <span id="player-event" class="text-xs text-slate-400 truncate"></span>
                        </div>
                        <h2 id="player-title" class="mt-2 text-base sm:text-lg font-semibold text-slate-100 truncate"></h2>
                    </div>

                    <button type="button" id="close-player" class="icon-button shrink-0 border border-slate-600 hover:border-white hover:text-white text-slate-300 rounded-lg px-3 sm:px-4 py-2 transition-all flex items-center gap-2 font-medium text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Close
                    </button>
                </div>

                <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative" style="aspect-ratio: 16 / 9;">
                    <video id="native-video" controls autoplay muted playsinline referrerpolicy="no-referrer"></video>
                    <div id="player-message" class="hidden absolute inset-0 items-center justify-center bg-black/80 text-center px-6 text-sm text-slate-300"></div>
                </div>
            </div>
        </div>
